<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>カードバトル</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../common/header.css">
</head>
<body class="has-game-header">
    <!-- 背景アンビエント [V6] -->
    <div class="ambient-bg">
        <div class="ambient-orb orb-1"></div>
        <div class="ambient-orb orb-2"></div>
        <div class="ambient-orb orb-3"></div>
        <div class="ambient-orb orb-4"></div>
    </div>
    <div class="scanline-overlay"></div>

    <nav class="game-header" style="display:none">
        <span class="game-header-title">カードバトル</span>
        <a href="../" class="game-header-back">← ゲーム一覧</a>
    </nav>

    <div class="container">
        <div class="battle-area">
            <div class="cpu-area">
                <h3>CPU <span id="cpu-deck-info" class="deck-info"></span></h3>
                <div id="cpu-hand" class="hand cpu-hand"></div>
            </div>

            <div class="field">
                <div class="played-card-area">
                    <div class="played-label">CPU</div>
                    <div id="cpu-played" class="played-card"></div>
                </div>
                <div class="vs">VS</div>
                <div class="played-card-area">
                    <div class="played-label">あなた</div>
                    <div id="player-played" class="played-card"></div>
                </div>
            </div>

            <div class="player-area">
                <h3>あなた <span id="player-deck-info" class="deck-info"></span></h3>
                <div id="player-hand" class="hand player-hand"></div>
            </div>
        </div>

        <div class="game-panel">
            <h1>カードバトル</h1>
            <p class="subtitle">〜 Element Clash 〜</p>

            <!-- コントロール行 -->
            <div class="controls-row">
                <div class="difficulty-selector">
                    <div class="difficulty-label">難易度</div>
                    <div class="difficulty-buttons" id="difficulty-buttons">
                        <button class="difficulty-btn" data-difficulty="easy">
                            <span class="diff-icon">★</span>
                            <span class="diff-name">Easy</span>
                        </button>
                        <button class="difficulty-btn active" data-difficulty="normal">
                            <span class="diff-icon">★★</span>
                            <span class="diff-name">Normal</span>
                        </button>
                        <button class="difficulty-btn" data-difficulty="hard">
                            <span class="diff-icon">★★★</span>
                            <span class="diff-name">Hard</span>
                        </button>
                    </div>
                </div>
                <button id="mute-btn" class="icon-btn" title="サウンド切替">🔊</button>
            </div>

            <div class="game-info">
                <div class="round-display">
                    ラウンド: <span id="current-round">1</span>　<span class="mode-label">3点先取</span>
                </div>
                <div class="score-display">
                    <div class="score player-score">
                        あなた:
                        <div id="player-win-dots" class="win-dots">
                            <span class="win-dot"></span>
                            <span class="win-dot"></span>
                            <span class="win-dot"></span>
                        </div>
                    </div>
                    <div class="score cpu-score">
                        CPU:
                        <div id="cpu-win-dots" class="win-dots">
                            <span class="win-dot"></span>
                            <span class="win-dot"></span>
                            <span class="win-dot"></span>
                        </div>
                    </div>
                </div>
            </div>

            <div id="message" class="message">カードを選んでください</div>

            <!-- アクションボタン群 -->
            <div class="action-buttons">
                <button id="reset-btn" class="reset-btn">リセット</button>
                <button id="collection-btn" class="action-btn">📋 カード一覧</button>
            </div>
        </div>

        <div class="rules-bar">
            <div class="rule-item">
                <span class="rule-elem" style="color:#ff6b6b">火</span>
                <span class="rule-arrow">→</span>
                <span class="rule-elem" style="color:#69db7c">草</span>
                <span class="rule-arrow">→</span>
                <span class="rule-elem" style="color:#4dabf7">水</span>
                <span class="rule-arrow">→</span>
                <span class="rule-elem" style="color:#ff6b6b">火</span>
                <span class="rule-bonus">有利+3</span>
            </div>
            <div class="rule-item">
                <span class="rule-elem" style="color:#ffe066">光</span>
                <span class="rule-reversal-sym">⟲</span>
                <span class="rule-elem" style="color:#845ef7">闇</span>
                <span class="rule-desc">低パワーが勝つ</span>
            </div>
            <div class="rule-item">
                <span class="rule-label-chain">🔗チェイン</span>
                <span class="rule-desc">同属性を連続で出すと</span>
                <span>2連+1 / 3連+2 /</span>
                <span class="rule-chain-max">4連+4 不利無効</span>
            </div>
            <div class="rule-item">
                <span class="rule-label-sacrifice">⚡サクリファイス</span>
                <span class="rule-desc">カードを捨てて</span>
                <span>パワー÷2を次に加算</span>
            </div>
        </div>
    </div>

    <script src="constants.js"></script>
    <script src="sound.js"></script>
    <script src="utils.js"></script>
    <script src="game.js"></script>
    <script src="ui.js"></script>
</body>
</html>
