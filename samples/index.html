<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ゲーム一覧</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a1a2e 50%, #16213e 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 40px 20px;
        }

        h1 {
            color: #e0e0e0;
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 8px;
            letter-spacing: 0.02em;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.4);
            font-size: 14px;
            margin-bottom: 40px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            max-width: 560px;
            width: 100%;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 32px 24px;
            text-decoration: none;
            text-align: center;
            transition: transform 0.2s, background 0.2s, border-color 0.2s;
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-4px);
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .card-icon {
            font-size: 48px;
            margin-bottom: 16px;
            display: block;
        }

        .card-name {
            color: #e0e0e0;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .card-desc {
            color: rgba(255, 255, 255, 0.45);
            font-size: 13px;
            line-height: 1.5;
        }

        @media (max-width: 480px) {
            .grid {
                grid-template-columns: 1fr;
                max-width: 280px;
            }
        }
    </style>
</head>
<body>
    <h1>Game Collection</h1>
    <p class="subtitle">AI Agent Game Streamer</p>

    <div class="grid">
        <a href="othello/" class="card">
            <span class="card-icon">🟢</span>
            <div class="card-name">オセロ</div>
            <div class="card-desc">8x8ボードで石を挟んで裏返す定番ゲーム</div>
        </a>

        <a href="gomoku/" class="card">
            <span class="card-icon">⭕</span>
            <div class="card-name">五目並べ</div>
            <div class="card-desc">先に5つ並べた方が勝ちの対戦ゲーム</div>
        </a>

        <a href="sokoban/" class="card">
            <span class="card-icon">📦</span>
            <div class="card-name">倉庫番</div>
            <div class="card-desc">箱を押してゴールに運ぶパズルゲーム</div>
        </a>

        <a href="card-battle/" class="card">
            <span class="card-icon">🃏</span>
            <div class="card-name">カードバトル</div>
            <div class="card-desc">属性カードで戦うElement Clash</div>
        </a>
    </div>
</body>
</html>
