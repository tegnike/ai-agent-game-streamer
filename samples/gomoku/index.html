<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>五目並べ</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../common/header.css">
</head>
<body class="has-game-header">
    <nav class="game-header">
        <span class="game-header-title">五目並べ</span>
        <a href="../" class="game-header-back">← ゲーム一覧</a>
    </nav>
    <div class="container">
        <div id="board" class="board"></div>

        <div class="game-panel">
            <h1>五目並べ</h1>

            <div class="game-info">
                <div class="turn-display">
                    現在のターン: <span id="current-turn" class="black-text">黒（あなた）</span>
                </div>
                <div class="score-display">
                    <div class="score black-score">
                        <span class="stone-icon black"></span>
                        <span id="black-count">0</span>
                    </div>
                    <div class="score white-score">
                        <span class="stone-icon white"></span>
                        <span id="white-count">0</span>
                    </div>
                </div>
            </div>

            <div id="message" class="message"></div>

            <button id="reset-btn" class="reset-btn">リセット</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
